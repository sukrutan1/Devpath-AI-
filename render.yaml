services:
  - type: web
    name: devpath-ai
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd client && npm install && npm run build
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: NODE_VERSION
        value: "20"
