<style>
        body {
            background-color: #0f172a;
            color: #e7e0ed;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Glow effects */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.1;
        }

        /* Custom Radio Button Styling */
        .choice-button {
            transition: all 0.3s ease;
        }
        .choice-button:hover {
            border-color: rgba(208,188,255,0.3);
            background: rgba(208,188,255,0.05);
            transform: translateY(-2px);
        }
        .choice-button.selected {
            border-color: theme('colors.primary');
            background: rgba(208,188,255,0.1);
            box-shadow: 0 0 20px rgba(208,188,255,0.2);
        }
        
        /* Progress Bar Animation */
        .progress-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Slide Transition for Questions */
        .slide-enter {
            animation: slideInRight 0.4s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide-exit {
            animation: slideOutLeft 0.4s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide-enter-reverse {
            animation: slideInLeft 0.4s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOutLeft {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-50px); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

    </style>
</head>
